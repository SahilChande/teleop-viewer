<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teleoperation camera viewer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    /* Everything fits one screen: the grid takes the height left under the
       header and each video scales inside its tile (no page scrolling). */
    html, body { height: 100%; }
    body { margin: 0; background: #101318; color: #f5f7fa; display: flex; flex-direction: column; overflow: hidden; }
    header { flex: none; padding: 10px 20px; display: flex; gap: 16px; align-items: baseline; }
    h1 { margin: 0; font-size: 20px; }
    #status { color: #aeb8c5; }
    #sound { font: inherit; padding: 2px 12px; border-radius: 6px; border: 1px solid #343c48; background: #1b2028; color: inherit; cursor: pointer; }
    #grid { flex: 1; min-height: 0; display: grid; gap: 12px; padding: 0 20px 20px; }
    article { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #1b2028; border: 1px solid #343c48; border-radius: 10px; overflow: hidden; }
    h2 { flex: none; margin: 0; padding: 6px 12px; font-size: 15px; }
    video { display: block; flex: 1; min-height: 0; width: 100%; height: 100%; background: #000; object-fit: contain; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.22.3/dist/livekit-client.umd.min.js"></script>
</head>
<body>
  <header><h1>International teleoperation cameras</h1><span id="status">Connecting…</span><button id="sound" hidden>Turn sound on</button></header>
  <main id="grid"></main>
  <script>
    const status = document.querySelector('#status');
    const grid = document.querySelector('#grid');
    // Long link: url + token come in the #fragment (never sent to the page's
    // server). They are kept in sessionStorage so a reload of the same tab (F5,
    // a big screen that refreshes) reconnects instead of losing the link.
    // Short link: #k=<code>, resolved by resolveShortLink() below; it stays in
    // the address bar and is resolved again on every reload.
    const params = new URLSearchParams(location.hash.slice(1));
    const shortCode = params.get('k');
    let url = params.get('url');
    let token = params.get('token');
    if (!shortCode) {
      try {
        if (url && token) {
          sessionStorage.setItem('teleopViewer', JSON.stringify({ url, token }));
        } else {
          ({ url, token } = JSON.parse(sessionStorage.getItem('teleopViewer')) || {});
        }
      } catch (_) {}
      try { history.replaceState(null, '', location.href.split('#')[0]); } catch (_) {}
    }

    // links/<first 32 hex of sha256(code)>.json next to this page holds
    // {salt, iv, iterations, data}: AES-GCM (key = PBKDF2-SHA256 of the code) of
    // {url, token}. The code never leaves the browser; without it the public
    // file is useless. Written by davegi_teleop_demo ./viewer_link.sh.
    async function resolveShortLink(code) {
      const encoder = new TextEncoder();
      const digest = new Uint8Array(await crypto.subtle.digest('SHA-256', encoder.encode(code)));
      const id = [...digest].map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 32);
      const response = await fetch(`links/${id}.json`, { cache: 'no-store' });
      if (response.status === 404) throw new Error('This link is unknown or was switched off.');
      if (!response.ok) throw new TypeError(`HTTP ${response.status}`);
      const box = await response.json();
      const bytes = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));
      const base = await crypto.subtle.importKey('raw', encoder.encode(code), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', hash: 'SHA-256', salt: bytes(box.salt), iterations: box.iterations },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(box.iv) }, key, bytes(box.data));
      return JSON.parse(new TextDecoder().decode(plain));
    }

    // With a scene camera (it films the whole robot): scene on the left half,
    // full height; the other cameras stacked on the right half. Otherwise a
    // near-square grid sized to the number of cameras: 1 -> full screen,
    // 2 -> side by side, 3-4 -> 2x2.
    const SCENE = 'scene_camera';
    // Fixed order on screen, whatever order the cameras join in.
    const ORDER = ['scene_camera', 'realsense', 'left_wrist_camera', 'right_wrist_camera'];
    function layout() {
      const cards = [...grid.children];
      for (const card of cards) {
        const rank = ORDER.findIndex(key => card.dataset.name.includes(key));
        card.style.order = rank < 0 ? ORDER.length : rank;
      }
      const scene = cards.find(card => card.dataset.name.includes(SCENE));
      if (scene && cards.length > 1) {
        grid.style.gridTemplateColumns = 'repeat(2, minmax(0, 1fr))';
        grid.style.gridTemplateRows = `repeat(${cards.length - 1}, minmax(0, 1fr))`;
        for (const card of cards) {
          card.style.gridColumn = card === scene ? '1' : '2';
          card.style.gridRow = card === scene ? '1 / -1' : '';
        }
        return;
      }
      for (const card of cards) { card.style.gridColumn = ''; card.style.gridRow = ''; }
      const n = Math.max(1, cards.length);
      const cols = Math.ceil(Math.sqrt(n));
      grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
      grid.style.gridTemplateRows = `repeat(${Math.ceil(n / cols)}, minmax(0, 1fr))`;
    }

    function addCard(id, name, track) {
      const card = document.createElement('article');
      card.id = id;
      card.dataset.name = name;
      const title = document.createElement('h2');
      title.textContent = name;
      const element = track.attach();
      element.autoplay = true;
      element.playsInline = true;
      card.append(title, element);
      grid.append(card);
    }

    // Audio tracks (robot microphone, ./audio_bringup.sh) play through hidden
    // elements; one viewer identity = one connection, so video and audio share this page.
    const sound = document.querySelector('#sound');
    let muted = false;
    const audioElements = () => document.querySelectorAll('audio');
    // One button: shown while a robot audio track exists; "on" needs a click first
    // (browser autoplay rule), after that it toggles mute.
    function refreshSound() {
      const room = window.teleopRoom;
      sound.hidden = !room || audioElements().length === 0;
      const playing = room && room.canPlaybackAudio && !muted;
      sound.textContent = playing ? 'Turn sound off' : 'Turn sound on';
      audioElements().forEach(element => { element.muted = muted; });
    }
    sound.onclick = async () => {
      const room = window.teleopRoom;
      if (room.canPlaybackAudio && !muted) muted = true;
      else { muted = false; await room.startAudio(); }
      refreshSound();
    };

    function showTrack(track, publication, participant) {
      if (track.kind === 'audio') {
        const element = track.attach();
        element.id = `${publication.trackSid}-audio`;
        document.body.append(element);
        refreshSound();
        return;
      }
      if (track.kind !== 'video' || document.getElementById(publication.trackSid)) return;
      const name = publication.trackName || `${participant.identity} video`;
      addCard(publication.trackSid, name, track);
      layout();
    }

    async function connect() {
      const room = new LivekitClient.Room({ adaptiveStream: false, dynacast: false });
      room.on(LivekitClient.RoomEvent.TrackSubscribed, showTrack);
      room.on(LivekitClient.RoomEvent.TrackUnsubscribed, (_track, publication) => {
        document.getElementById(publication.trackSid)?.remove();
        document.getElementById(`${publication.trackSid}-audio`)?.remove();
        refreshSound();
        layout();
      });
      room.on(LivekitClient.RoomEvent.AudioPlaybackStatusChanged, refreshSound);
      // LiveKit itself rides out short network drops; after a real disconnect
      // (e.g. a Wi-Fi outage at the venue) this page joins again on its own.
      room.on(LivekitClient.RoomEvent.Disconnected, reason => {
        grid.replaceChildren();
        document.querySelectorAll('audio').forEach(element => element.remove());
        layout();
        window.teleopRoom = null;
        refreshSound();
        // Same link opened on another screen: rejoining would kick that one out,
        // and the two would take turns forever. Stay out instead.
        if (reason === LivekitClient.DisconnectReason.DUPLICATE_IDENTITY) {
          status.textContent = 'Disconnected: this link was opened on another screen. Reload to take over.';
          return;
        }
        // Removed on purpose (server API): LiveKit also revokes the token.
        if (reason === LivekitClient.DisconnectReason.PARTICIPANT_REMOVED) {
          status.textContent = 'Disconnected: this link was switched off.';
          return;
        }
        retry('Disconnected');
      });
      await room.connect(url, token, { autoSubscribe: true });
      status.textContent = `Connected to ${room.name}`;
      window.teleopRoom = room;
      retryDelay = 2;
      refreshSound();
    }

    let retryDelay = 2;
    let retryTimer = null;
    function retry(reason) {
      status.textContent = `${reason} -- retrying in ${retryDelay} s`;
      if (retryTimer) return;   // one pending retry, even if several events fire
      retryTimer = setTimeout(() => { retryTimer = null; start(); }, retryDelay * 1000);
      retryDelay = Math.min(retryDelay * 2, 30);
    }
    function start() {
      if (!url || !token) { status.textContent = 'Viewer URL or token is missing.'; return; }
      status.textContent = 'Connecting…';
      connect().catch(error => {
        // Expired or revoked token: retrying cannot help, a new link is needed.
        if (error.reason === LivekitClient.ConnectionErrorReason.NotAllowed || error.status === 401) {
          status.textContent = 'This link has expired or was switched off -- ask for a new link.';
          return;
        }
        retry(`Connection failed: ${error.message}`);
      });
    }
    async function begin() {
      if (shortCode) {
        try {
          ({ url, token } = await resolveShortLink(shortCode));
        } catch (error) {
          // Network trouble (fetch -> TypeError): try again; anything else is final.
          if (error instanceof TypeError) {
            status.textContent = 'Opening the link failed (network) -- retrying in 5 s';
            setTimeout(begin, 5000);
          } else {
            status.textContent = error.message.startsWith('This link')
              ? error.message : 'This link could not be opened (wrong or damaged code).';
          }
          return;
        }
      }
      start();
    }
    begin();
  </script>
</body>
</html>
